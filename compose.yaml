services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://arena:arena@db:5432/arena?sslmode=disable"
      ARENA_MODEL_URL: "http://model:8090"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      model:
        condition: service_healthy
    restart: unless-stopped

  model:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8090:8090"
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

