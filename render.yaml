services:
  - type: web
    name: negotiation-arena
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: negotiation-arena-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_TTL
        value: 12h
      - key: LLM_PROVIDER
        value: mock

databases:
  - name: negotiation-arena-db
    plan: basic-256mb

